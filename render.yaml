# ApproveFlow on Render: managed Postgres + API only.
# Frontend stays on Vercel (see vercel.json).
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: approveflow-db
    plan: free
    databaseName: approveflow
    user: approveflow

services:
  - type: web
    name: approveflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: approveflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://approve-flow-gamma.vercel.app
      - key: APP_URL
        value: https://approve-flow-gamma.vercel.app
      - key: EXPOSE_DEBUG_TOKENS
        value: 'false'
      - key: PORT
        value: '3000'
      # Required in production (password reset / invites). Set after deploy.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: REDIS_URL
        sync: false
